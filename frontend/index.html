<!DOCTYPE html>
<html>

<head>
  <title>Cyber Threat Detection</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 40px;
    }

    input {
      padding: 12px;
      margin: 10px;
      width: 280px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    button {
      padding: 12px 25px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <h1>🚀 Cyber Threat Detection</h1>

  <input id="port" placeholder="Destination Port (e.g. 80)" /><br>
  <input id="duration" placeholder="Flow Duration" /><br>
  <input id="fwd" placeholder="Total Fwd Packets" /><br>
  <input id="bwd" placeholder="Total Backward Packets" /><br>

  <br>

  <button onclick="predict()">Detect Threat</button>

  <div id="result"></div>

  <script>
    async function predict() {
      const data = {
        "Destination Port": Number(document.getElementById("port").value) || 0,
        "Flow Duration": Number(document.getElementById("duration").value) || 0,
        "Total Fwd Packets": Number(document.getElementById("fwd").value) || 0,
        "Total Backward Packets": Number(document.getElementById("bwd").value) || 0
      };

      const res = await fetch("https://ai-cyber-threat-detector-1-s8ax.onrender.com/predict", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      document.getElementById("result").innerHTML =
        `<span style="color:${result[0].prediction === 'BENIGN' ? 'lightgreen' : 'red'}">
    Prediction: ${result[0].prediction}
  </span><br>
  Confidence: ${result[0].confidence}`;
    }
  </script>

</body>

</html>
