name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Optional: Spin up Redis service for testing (though our rate-limiting middleware falls back to memory gracefully)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create mock models structure
      run: |
        mkdir -p models
        # Create empty pkl/onnx models if tests need them, but we have them committed in Git
        # If models are not in git, we can run train, but they are in models/ inside git, so we are good.

    - name: Run tests with pytest
      run: |
        python -m pytest
